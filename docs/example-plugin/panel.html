<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Example panel</title>
    <style>
      /* A panel is as tall as its content (the bridge reports the height): no height:100%, no scrolling */
      body { margin: 0; padding: 2px 0 6px; background: transparent; color: var(--wp-fg); font: 14px/1.5 var(--wp-font, system-ui, sans-serif); }
      p { margin: 4px 0; }
      .muted { color: var(--wp-muted); }
      button { font: inherit; padding: 3px 10px; margin-right: 6px; color: var(--wp-accent-fg); background: var(--wp-accent); border: 0; border-radius: 6px; cursor: pointer; }
      input { font: inherit; width: 8em; padding: 2px 6px; color: var(--wp-fg); background: var(--wp-bg-2); border: 1px solid var(--wp-border); border-radius: 6px; }
      #lines p { font: 12.5px var(--wp-mono, monospace); }
    </style>
  </head>
  <body>
    <p id="where" class="muted"></p>
    <div id="letters" hidden>
      <p>Link projects starting with these letters (empty: all): <input id="input" /> <button id="set">Apply</button></p>
      <p id="linked" class="muted"></p>
    </div>
    <p><button id="add">Add a line</button> <span class="muted">The panel's height follows its content. Right-click for a menu.</span></p>
    <div id="lines"></div>
    <script type="module" src="panel.mjs"></script>
  </body>
</html>
